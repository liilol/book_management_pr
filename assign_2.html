<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 관리 시스템 OOP 다형성 시각화 (완성형)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tree-line::before {
            content: ''; position: absolute; top: -24px; left: 50%;
            width: 2px; height: 24px; background-color: #cbd5e1;
        }
        .tree-horizontal-line {
            position: absolute; top: -24px; left: 12.5%;
            width: 75%; height: 2px; background-color: #cbd5e1;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: translateY(10px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-pop-in { animation: popIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-gray-800 p-8 flex flex-col items-center min-h-screen">

    <h1 class="text-3xl font-bold mb-8 text-slate-800">📚 도서 장르별 다형성 시각화</h1>

    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-10 w-full max-w-3xl">
        <h2 class="text-lg font-bold mb-4 text-slate-700 flex items-center gap-2">
            <span>⚙️</span> 도서 정보 및 파라미터 설정 (입력칸을 비우면 디폴트 책이 나옵니다)
        </h2>
        
        <div class="flex gap-4 mb-4">
            <div class="flex-1">
                <label class="block text-sm font-medium text-slate-600 mb-1">책 제목 (Overriding)</label>
                <input type="text" id="bookTitleInput" placeholder="비우면 장르별 기본 책 제목 사용" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 transition-all">
            </div>
            <div class="flex-1">
                <label class="block text-sm font-medium text-slate-600 mb-1">ISBN</label>
                <input type="text" id="isbnInput" placeholder="비우면 기본 ISBN 사용" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 transition-all">
            </div>
            <div class="flex-1">
                <label class="block text-sm font-medium text-slate-600 mb-1">책 표지 (이미지 URL)</label>
                <input type="text" id="imgUrlInput" placeholder="https://..." class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 transition-all">
            </div>
        </div>

        <div class="flex gap-4 border-t border-slate-100 pt-4">
            <div class="flex-1">
                <label class="block text-sm font-medium text-slate-600 mb-1">주인공 (Hero)</label>
                <input type="text" id="heroInput" value="카제하야 쇼타" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 transition-all">
            </div>
            <div class="flex-1">
                <label class="block text-sm font-medium text-slate-600 mb-1">히로인 (Heroine)</label>
                <input type="text" id="heroinInput" value="쿠로누마 사와코" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 transition-all">
            </div>
        </div>
    </div>

    <div class="mb-12 w-full max-w-4xl relative flex flex-col items-center">
        <div class="bg-white border-2 border-slate-300 text-slate-800 p-4 rounded-xl shadow-sm w-64 text-center z-10">
            <h3 class="font-black text-lg">Book (Base Class)</h3>
            <p class="text-xs text-slate-500 mt-1">공통 메서드: read(), provide_preview()</p>
        </div>

        <div class="w-0.5 h-8 bg-slate-300"></div>

        <div class="relative w-full flex justify-between pt-6">
            <div class="tree-horizontal-line"></div>

            <button onclick="triggerPolymorphism('shojo', this)" class="tree-line relative bg-white border-2 border-pink-200 hover:border-pink-500 hover:shadow-md transition-all p-4 rounded-xl w-1/5 text-center cursor-pointer class-card group">
                <div class="text-2xl mb-1 group-hover:scale-110 transition-transform">🌸</div>
                <h4 class="font-bold text-pink-700">Shojo</h4>
                <p class="text-xs text-slate-500 mt-1">순정 만화</p>
            </button>
            
            <button onclick="triggerPolymorphism('shonen', this)" class="tree-line relative bg-white border-2 border-orange-200 hover:border-orange-500 hover:shadow-md transition-all p-4 rounded-xl w-1/5 text-center cursor-pointer class-card group">
                <div class="text-2xl mb-1 group-hover:scale-110 transition-transform">🔥</div>
                <h4 class="font-bold text-orange-700">Shonen</h4>
                <p class="text-xs text-slate-500 mt-1">소년 만화</p>
            </button>

            <button onclick="triggerPolymorphism('fantasy', this)" class="tree-line relative bg-white border-2 border-purple-200 hover:border-purple-500 hover:shadow-md transition-all p-4 rounded-xl w-1/5 text-center cursor-pointer class-card group">
                <div class="text-2xl mb-1 group-hover:scale-110 transition-transform">🪄</div>
                <h4 class="font-bold text-purple-700">Fantasy</h4>
                <p class="text-xs text-slate-500 mt-1">이세계 판타지</p>
            </button>

            <button onclick="triggerPolymorphism('sliceOfLife', this)" class="tree-line relative bg-white border-2 border-green-200 hover:border-green-500 hover:shadow-md transition-all p-4 rounded-xl w-1/5 text-center cursor-pointer class-card group">
                <div class="text-2xl mb-1 group-hover:scale-110 transition-transform">☕</div>
                <h4 class="font-bold text-green-700">SliceOfLife</h4>
                <p class="text-xs text-slate-500 mt-1">일상/코미디</p>
            </button>
        </div>
    </div>

    <div id="visualOutput" class="w-full max-w-3xl hidden">
        </div>

    <script>
        // --- 1. 클래스 정의 (다형성 논리 유지) ---
        class Book {
            constructor(name, ISBN, genre) {
                this.name = name; this.ISBN = ISBN; this.genre = genre;
            }
            read() { return `'${this.name}' 도서를 읽기 시작합니다.`; }
            providePreview(hero, heroin) {
                if (hero && heroin) return `[${hero}와 ${heroin}의] '${this.genre}' 이야기!`;
                if (hero) return `[${hero}의] '${this.genre}' 이야기!`;
                return `[아무도 모르는...] '${this.genre}' 이야기!`;
            }
            getTheme() { return { color: 'slate', icon: '📘' }; }
        }

        class Shojo extends Book {
            constructor(name, ISBN) { super(name, ISBN, "순정(소녀)"); }
            read() { return `설레는 마음으로 감정선을 따라 읽습니다. 💖`; }
            providePreview(hero, heroin) {
                if (hero && heroin) return `[${hero}와 ${heroin}의] 로맨스, 감정 위주의 달달한 러브스토리!`;
                if (hero) return `[주인공 ${hero}의] 달달한 로맨스 러브스토리! 과연, 히로인은 누굴까!`;
                return super.providePreview(hero, heroin);
            }
            getTheme() { return { color: 'pink', icon: '🌸', bg: 'bg-pink-50', border: 'border-pink-200', text: 'text-pink-800' }; }
        }

        class Shonen extends Book {
            constructor(name, ISBN) { super(name, ISBN, "소년"); }
            read() { return `뜨거운 열정과 액션에 몰입하여 읽습니다. 👊`; }
            providePreview(hero, heroin) {
                if (hero && heroin) return `[${hero}와 ${heroin}의] 액션, 모험 위주의 활극!`;
                return super.providePreview(hero, heroin);
            }
            getTheme() { return { color: 'orange', icon: '🔥', bg: 'bg-orange-50', border: 'border-orange-200', text: 'text-orange-800' }; }
        }

        class Fantasy extends Book {
            constructor(name, ISBN) { super(name, ISBN, "판타지(이세계)"); }
            read() { return `거대한 세계관과 마법의 세계에 빠져듭니다. ✨`; }
            providePreview(hero, heroin) {
                if (hero && heroin) return `[${hero}와 ${heroin}의] 마법과 끝없는 모험의 이야기!`;
                if (hero) return `[주인공 ${hero}의] 이세계 구원 모험기!`;
                return super.providePreview(hero, heroin);
            }
            getTheme() { return { color: 'purple', icon: '🪄', bg: 'bg-purple-50', border: 'border-purple-200', text: 'text-purple-800' }; }
        }

        class SliceOfLife extends Book {
            constructor(name, ISBN) { super(name, ISBN, "일상(코미디)"); }
            read() { return `편안하게 웃으며 일상의 소소함을 즐깁니다. 🍵`; }
            providePreview(hero, heroin) {
                if (hero) return `[${hero}의] 편안하고 소소한 일상 이야기!`;
                if (heroin) return `주인공은 나다! [주인공 ${heroin}의] 왁자지껄 코미디!`;
                return super.providePreview(hero, heroin);
            }
            getTheme() { return { color: 'green', icon: '☕', bg: 'bg-green-50', border: 'border-green-200', text: 'text-green-800' }; }
        }

        // --- 2. 기본 디폴트 책 데이터 정의 (상현님이 직접 이미지 링크를 넣으실 곳!) ---
        const bookPresets = {
            shojo: {
                title: "너에게 닿기를",
                isbn: "979-114-619-357",
                // 인터넷에서 복사한 실제 이미지 URL을 여기에 고정해서 넣으세요 (아래는 예시)
                imgUrl: "https://th.bing.com/th/id/OIP.W2oTdePL_mkM9-rHHok_3QAAAA?w=204&h=305&c=7&r=0&o=7&dpr=2.2&pid=1.7&rm=3" 
            },
            shonen: {
                title: "이니셜 D",
                isbn: "979-113-132-458",
                imgUrl: "https://th.bing.com/th/id/OIP.iO-e69ARj1sVuRmmxbDghAHaIv?w=154&h=182&c=7&r=0&o=7&dpr=2.2&pid=1.7&rm=3"
            },
            fantasy: {
                title: "이 멋진 세계에 축복을!",
                isbn: "978-892-780-692",
                imgUrl: "https://th.bing.com/th/id/OIP.oSizFdblf5LoQ1t8qeQnxwHaK-?w=205&h=304&c=7&r=0&o=7&dpr=2.2&pid=1.7&rm=3"
            },
            sliceOfLife: {
                title: "유루캠프",
                isbn: "978-483-225-635",
                imgUrl: "https://th.bing.com/th/id/OIP.IkHtNBJz_fK8Yp5BbKSSywHaKv?w=125&h=182&c=7&r=0&o=7&dpr=2.2&pid=1.7&rm=3"
            }
        };

        // --- 3. UI 렌더링 (다형성 및 오버라이딩 로직 핵심) ---
        function triggerPolymorphism(genreKey, clickedElement) {
            // 3-1. 입력된 값 가져오기 (가장 앞에 '.trim()'을 붙여 공백 제거)
            const inputTitle = document.getElementById('bookTitleInput').value.trim();
            const inputIsbn = document.getElementById('isbnInput').value.trim();
            const inputImgUrl = document.getElementById('imgUrlInput').value.trim();
            const hero = document.getElementById('heroInput').value.trim();
            const heroin = document.getElementById('heroinInput').value.trim();
            
            // 3-2. 클릭한 장르의 프리셋 데이터 가져오기
            const preset = bookPresets[genreKey];

            // 3-3. ★ 핵심: 입력값 유무에 따라 최종 값 결정 (입력값 우선 적용)
            // 논리 연산자 '||' (OR)를 사용하여 '입력칸에 값이 있으면 쓰고, 비어있으면 프리셋 값을 쓴다'는 로직 구현
            const finalTitle = inputTitle || preset.title;
            const finalIsbn = inputIsbn || preset.isbn;
            const finalImgUrl = inputImgUrl || preset.imgUrl; // 만약 이미지칸을 비우면 프리셋 URL, 프리셋도 비워두면 이모지로 나옴

            // 3-4. 결정된 최종 데이터로 객체 인스턴스 동적 생성
            let book;
            if (genreKey === 'shojo') book = new Shojo(finalTitle, finalIsbn);
            else if (genreKey === 'shonen') book = new Shonen(finalTitle, finalIsbn);
            else if (genreKey === 'fantasy') book = new Fantasy(finalTitle, finalIsbn);
            else if (genreKey === 'sliceOfLife') book = new SliceOfLife(finalTitle, finalIsbn);

            // 3-5. 다형성 메서드 호출
            const readResult = book.read();
            const previewResult = book.providePreview(hero, heroin);
            const theme = book.getTheme();

            // 3-6. 이미지 태그 생성 로직 (URL 유무 판단)
            const imageElement = finalImgUrl 
                ? `<img src="${finalImgUrl}" alt="표지" class="w-24 h-32 object-cover rounded-md shadow-sm border border-slate-300">` 
                : `<div class="w-24 h-32 bg-white flex items-center justify-center rounded-md border border-slate-200 text-4xl shadow-sm">${theme.icon}</div>`;

            // 3-7. 화면에 최종 결과 렌더링
            const outputDiv = document.getElementById('visualOutput');
            outputDiv.innerHTML = `
                <div class="${theme.bg} border-2 ${theme.border} rounded-2xl p-8 shadow-lg animate-pop-in">
                    <div class="flex items-center gap-6 border-b ${theme.border} pb-4 mb-6">
                        ${imageElement}
                        <div>
                            <h2 class="text-2xl font-black ${theme.text} mb-1">${book.name}</h2>
                            <span class="text-sm text-slate-500 font-mono">ISBN: ${book.ISBN}</span>
                            <br>
                            <span class="inline-block bg-white px-3 py-1 rounded-full text-sm font-bold ${theme.text} border ${theme.border} mt-2 shadow-sm">
                                장르: ${book.genre}
                            </span>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div class="bg-white/80 p-4 rounded-xl border ${theme.border}">
                            <div class="text-xs font-bold text-slate-500 mb-1 uppercase tracking-wider">Method: read()</div>
                            <p class="text-lg font-medium text-slate-800">"${readResult}"</p>
                        </div>
                        <div class="bg-white/80 p-4 rounded-xl border ${theme.border}">
                            <div class="text-xs font-bold text-slate-500 mb-1 uppercase tracking-wider">Method: provide_preview(hero, heroine)</div>
                            <p class="text-lg font-medium text-slate-800">"${previewResult}"</p>
                        </div>
                    </div>
                </div>
            `;
            
            outputDiv.classList.remove('hidden');

            // 버튼 하이라이트 효과
            document.querySelectorAll('.class-card').forEach(el => {
                el.classList.remove('ring-4', 'ring-offset-2', 'ring-blue-400');
            });
            clickedElement.classList.add('ring-4', 'ring-offset-2', 'ring-blue-400');
        }
    </script>
</body>
</html>
